<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<title>Configuration</title>
<script>
  // Cache-bust the static assets — IRIS Web Gateway sets Expires: +1h on
  // /agentic/* by default, so without this the browser keeps stale
  // admin.js / admin.css for an hour after every change.
  (function () {
    var v = Date.now();
    document.write('<link rel="stylesheet" href="admin.css?v=' + v + '">');
    window.__agenticVer = v;
  })();
</script>
</head>
<body>
<header class="topbar">
  <div class="brand"></div>
  <div class="ns" id="ns-indicator">namespace: …</div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="agents"   class="active">Agents</button>
  <button data-tab="mcps">MCPs</button>
  <button data-tab="toolsets">ToolSets</button>
  <button data-tab="tools">Tools</button>
  <button data-tab="skills">Skills</button>
  <button data-tab="connections">Connections</button>
  <button data-tab="catalogs">Catalogs</button>
  <button data-tab="audit">Audit</button>
</nav>

<main id="main">
  <section class="panel" id="list-panel">
    <div class="panel-head">
      <h2 id="list-title">Agents</h2>
      <button id="btn-new" class="primary">+ New</button>
    </div>
    <div class="list" id="list"></div>
  </section>

  <section class="panel" id="detail-panel" hidden>
    <div class="panel-head">
      <h2 id="detail-title">Detail</h2>
      <div class="actions">
        <span id="unsaved-indicator">configuration has changed</span>
        <button id="btn-cancel">Cancel</button>
        <button id="btn-save"   class="primary">Save</button>
        <button id="btn-delete" class="danger">Delete</button>
      </div>
    </div>
    <div class="form" id="form"></div>
    <div id="detail-msg" class="msg"></div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<script>document.write('<scr' + 'ipt src="admin.js?v=' + window.__agenticVer + '"></scr' + 'ipt>');</script>
</body>
</html>
