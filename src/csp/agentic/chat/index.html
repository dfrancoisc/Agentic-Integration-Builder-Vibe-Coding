<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<title>agentic_interop · Chat</title>
<script>
  (function () {
    var v = Date.now();
    document.write('<link rel="stylesheet" href="chat.css?v=' + v + '">');
    window.__agenticVer = v;
  })();
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <button id="btn-toggle-history" class="brand-toggle" type="button" aria-label="Toggle chat history" title="Show / hide chat history">History</button>
    <span class="brand-title">Health Interop</span>
    <span class="brand-sub">Copilot</span>
  </div>
  <div class="meta">
    <span class="ns-pill unknown" id="ns-pill"><span class="label">Namespace</span><select class="value ns-select" id="ns-select" title="Namespace this chatbot operates in (sent as X-IRIS-Namespace)" style="background:transparent;border:0;color:inherit;font:inherit;cursor:pointer;outline:none;padding:0;max-width:170px;"><option value="">unknown</option></select></span>
    <span class="conn-pill unknown" id="conn-pill"><span class="label">Connection</span><span class="value" id="conn-value">resolving…</span></span>
    <button id="btn-new-chat" type="button" title="Start a new conversation (clears the agent's memory of prior turns)">+ New chat</button>
  </div>
</header>

<main id="main">
  <aside class="history-rail" id="history-rail" data-state="open">
    <div class="rail-head">
      <span class="rail-title">Conversations</span>
      <span class="rail-count" id="rail-count"></span>
    </div>
    <div class="rail-list" id="rail-list"></div>
    <div class="rail-foot">
      <span class="rail-tip">Stored locally · this browser</span>
    </div>
  </aside>

  <section class="chat-col">
    <section class="messages" id="messages">
      <div class="empty-state" id="empty-state"></div>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <div class="composer-shell" id="composer-shell">
        <div id="attach-chips" class="attach-chips" hidden></div>
        <textarea id="input" placeholder="Ask anything about your interop work — or type / for commands · drop a PDF, xlsx, txt or md to attach" rows="2" autofocus></textarea>
        <div class="composer-actions">
          <button id="btn-attach" type="button" class="ghost" title="Attach file (PDF, .xlsx, .txt, .md)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 6v11a4.5 4.5 0 0 1-9 0V6.5a3 3 0 1 1 6 0V16a1.5 1.5 0 0 1-3 0V7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input type="file" id="file-picker" multiple accept=".pdf,.xlsx,.xlsm,.txt,.md,.markdown" hidden>
          <span class="composer-hint">↵ to send · ⇧↵ for newline · drop files to attach</span>
          <button id="btn-send" type="submit" class="primary">Send</button>
        </div>
      </div>
    </form>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<script>document.write('<scr' + 'ipt src="chat.js?v=' + window.__agenticVer + '"></scr' + 'ipt>');</script>
</body>
</html>
